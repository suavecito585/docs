# Child repositories pulled into this site by .github/workflows/multirepo.yml.
# Each child publishes an already-assembled Mintlify site to the branch named in `ref`;
# `destination` is both the folder here and the URL path. Edit content in the child repo:
# synced folders and docs.json are overwritten on every run. Site settings live in docs.base.json.
sources:
  - repo: The-40-Thieves/reliquary-tc
    ref: docs-site
    destination: reliquary-tc
    name: Reliquary-TC
