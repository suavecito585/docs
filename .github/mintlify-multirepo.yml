# Child repositories pulled into this site by .github/workflows/multirepo.yml.
# Each child holds a Mintlify site (a docs.json and its pages) in the folder `path` on the branch
# `ref`; the defaults are the repository root and the default branch. `destination` is both the
# folder here and the URL path. Edit content in the child repo: synced folders and docs.json are
# overwritten on every run. Site settings live in docs.base.json.
sources:
  - repo: The-40-Thieves/reliquary-tc
    ref: docs-site
    destination: reliquary-tc
    name: Reliquary-TC
  - repo: The-40-Thieves/own-the-house
    path: docs
    destination: own-the-house
    name: own-the-house
  - repo: The-40-Thieves/codecalc
    ref: docs-site
    destination: codecalc
    name: codecalc
  - repo: The-40-Thieves/alexandria-mcp
    ref: docs-site
    destination: alexandria-mcp
    name: alexandria-mcp
  - repo: The-40-Thieves/audio-forge
    ref: docs-site
    destination: audio-forge
    name: audio-forge
